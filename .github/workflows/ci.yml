# CI 门禁：PR 到 main 与 push 到 main 时自动检查
# 三 job 并行：前端 eslint+vitest+build / 后端 ruff+pytest / compose 构建验证
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 最小权限：三个 job 都只读代码
permissions:
  contents: read

# 同一 ref 的新提交自动取消旧运行，省 CI 时长
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（eslint + vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本读 frontend/package.json 的 packageManager 字段（action 默认读仓库根，必须显式指路），
      # 与本地 / Dockerfile corepack 同源
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # engines 要求 >=22.12，锁 22 主线
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # --max-warnings 0：warning 也视为失败，防「只提示不拦截」退化（遗留①闭环）
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build

  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # pyproject requires-python >=3.12
      # --locked：锁文件与 pyproject 漂移时直接报错，防止 CI 每次装到不同版本
      - run: uv sync --locked
      - run: uv run ruff check .
      # pytest 用 SQLite 内存库（pyproject addopts），无需起 PostgreSQL 服务
      - run: uv run pytest

  docker-build:
    name: Docker 构建验证（compose build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose 插值需要 POSTGRES_* / DATABASE_URL；示例值只是占位，密钥永不入库
      - run: cp .env.example .env
      # 只验证前后端镜像能构建（P0 拍板）；起 stack 冒烟留待 CD 阶段
      - run: docker compose build
